<script>
const CONFIG = { API_URL: "https://yqdxeta204.execute-api.us-east-1.amazonaws.com/prod" };
</script>

<!-- Partials get injected here -->
<div id="partial-auth"></div>
<div id="partial-app"></div>
<div id="partial-modals"></div>
<div id="toast" class="toast"></div>

<script>
// Load HTML partials before app.js runs
(async function loadPartials() {
  const partials = [
    { id: 'partial-auth',   file: 'partials/auth.html' },
    { id: 'partial-app',    file: 'partials/app-shell.html' },
    { id: 'partial-modals', file: 'partials/modals.html' }
  ];
  
  await Promise.all(partials.map(async (p) => {
    try {
      const resp = await fetch(p.file + '?v=' + Date.now());
      const html = await resp.text();
      document.getElementById(p.id).innerHTML = html;
    } catch (e) {
      console.error('Failed to load partial: ' + p.file, e);
    }
  }));

  // Now load scripts after DOM is ready
  const scripts = ['ui.js', 'app.js'];
  for (const src of scripts) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.body.appendChild(s);
    });
  }
})();
</script>
</body>
</html>
