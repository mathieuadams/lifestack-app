workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Lifestack
    environment:
      groups:
        - ios_signing
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lifestack.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Verify iOS web bundle sync
        script: |
          diff -q www/index.html ios/App/App/public/index.html
          diff -q www/app.js ios/App/App/public/app.js
          diff -q www/ui.js ios/App/App/public/ui.js
          diff -q www/adventure.js ios/App/App/public/adventure.js
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_ID" || echo 0) + 1))
      - name: Fetch signing files
        script: app-store-connect fetch-signing-files com.lifestack.app --type IOS_APP_STORE --create
      - name: Initialize keychain
        script: keychain initialize
      - name: Add certs to keychain
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          keychain add-certificates
      - name: Use profiles
        script: xcode-project use-profiles
      - name: Build iOS app
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - lifestack_keystore
      vars:
        PACKAGE_NAME: com.lifestack.app
      node: 22
      java: 17
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android release
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
